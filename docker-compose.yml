services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: login_portal
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "--password=",
        ]
      start_period: 60s
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build:
      context: ./backend
      provenance: false
      sbom: false
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://16.170.204.236:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: login_portal
      DB_USER: root
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      provenance: false
      sbom: false
      args:
        NEXT_PUBLIC_API_URL: http://16.170.204.236:5000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
